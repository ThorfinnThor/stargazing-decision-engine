name: Data ingestion

on:
  workflow_dispatch:
    inputs:
      destinations:
        description: "Comma-separated destination or site slugs, or all"
        required: true
        default: all
        type: string
      catalog_scope:
        description: "Catalog cohort to ingest"
        required: true
        default: active
        type: choice
        options:
          - active
          - staged
          - all
      refresh_era5:
        description: "Fetch and process ERA5 climate snapshots"
        required: true
        default: false
        type: boolean
      refresh_black_marble:
        description: "Fetch, extract, and process Black Marble snapshots"
        required: true
        default: false
        type: boolean
      refresh_dem:
        description: "Fetch and process Copernicus DEM snapshots"
        required: true
        default: false
        type: boolean
      refresh_images:
        description: "Rebuild the image attribution manifest"
        required: true
        default: false
        type: boolean
      refresh_osm:
        description: "Reserved until an OSM importer is reviewed"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: data-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A complete three-source refresh for 100 staged sites is intentionally one
    # auditable batch and can take several hours on the hosted runner.
    timeout-minutes: 360
    env:
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
      CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
      CDSE_S3_ENDPOINT: ${{ secrets.CDSE_S3_ENDPOINT }}
      CDSE_S3_BUCKET: ${{ secrets.CDSE_S3_BUCKET }}
      CDSE_S3_PREFIX: ${{ secrets.CDSE_S3_PREFIX }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Install optional ingestion dependencies
        if: ${{ inputs.refresh_era5 || inputs.refresh_black_marble || inputs.refresh_dem }}
        run: python -m pip install -r requirements-data.txt
      - name: Resolve requested sites
        id: sites
        env:
          REQUESTED_DESTINATIONS: ${{ inputs.destinations }}
          CATALOG_SCOPE: ${{ inputs.catalog_scope }}
        run: |
          set -euo pipefail
          select_scope='def in_scope:
            ($scope == "all")
            or ($scope == "active" and .active == true)
            or ($scope == "staged" and .active == false);'
          if [[ "$REQUESTED_DESTINATIONS" == "all" ]]; then
            jq -r --arg scope "$CATALOG_SCOPE" "$select_scope .[] | select(in_scope) | .slug" \
              data-config/sources/observation-sites.json > /tmp/stargazing-sites
          else
            : > /tmp/stargazing-sites
            IFS=',' read -ra requested <<< "$REQUESTED_DESTINATIONS"
            for item in "${requested[@]}"; do
              slug="$(printf '%s' "$item" | xargs)"
              jq -r --arg scope "$CATALOG_SCOPE" --arg slug "$slug" \
                "$select_scope .[] | select(in_scope and (.slug == \$slug or .destinationId == \$slug)) | .slug" \
                data-config/sources/observation-sites.json >> /tmp/stargazing-sites
            done
            sort -u /tmp/stargazing-sites -o /tmp/stargazing-sites
          fi
          test -s /tmp/stargazing-sites
          jq -r --rawfile selected /tmp/stargazing-sites '
            ($selected | split("\n") | map(select(length > 0))) as $site_slugs
            | .[]
            | select(.slug as $slug | $site_slugs | index($slug))
            | .destinationId
          ' data-config/sources/observation-sites.json | sort -u > /tmp/stargazing-destinations
          test -s /tmp/stargazing-destinations
          jq -r --rawfile selected /tmp/stargazing-destinations '
            ($selected | split("\n") | map(select(length > 0))) as $destination_ids
            | .[]
            | select(.active and (.id as $id | $destination_ids | index($id)))
            | .slug
          ' data-config/sources/destinations.json | sort -u > /tmp/stargazing-active-destinations
          echo "count=$(wc -l < /tmp/stargazing-sites | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat /tmp/stargazing-sites
      - name: Prepare normalized source data
        run: |
          pnpm data:seed
          pnpm data:normalize
      - name: Fetch and process optional source snapshots
        env:
          REFRESH_ERA5: ${{ inputs.refresh_era5 }}
          REFRESH_BLACK_MARBLE: ${{ inputs.refresh_black_marble }}
          REFRESH_DEM: ${{ inputs.refresh_dem }}
          # CMR discovery plus Earthdata Cloud downloads use the existing EDL
          # token without requiring the unavailable URS login host.
          BLACK_MARBLE_PROVIDER: cmr
        run: |
          set -euo pipefail
          refresh_source() {
            set -euo pipefail
            local source="$1"
            local site="$2"
            if [[ "$source" == "era5" ]]; then
              pnpm data:era5:fetch --site "$site"
              pnpm data:era5:process --site "$site"
            elif [[ "$source" == "black-marble" ]]; then
              pnpm data:black-marble:fetch --site "$site"
              pnpm data:black-marble:extract --site "$site"
              pnpm data:black-marble:process --site "$site"
            elif [[ "$source" == "dem" ]]; then
              # The public COG mirror has stable, directly addressable tile
              # keys; CDSE eodata collection prefixes use a different layout.
              pnpm data:dem:fetch --site "$site" --public-fallback
              pnpm data:dem:process --site "$site"
            fi
          }
          export -f refresh_source
          # Authenticate and validate the smallest Black Marble batch first,
          # before spending time on the much larger ERA5 point histories.
          if [[ "$REFRESH_BLACK_MARBLE" == "true" ]]; then
            xargs -r -n 1 -P 3 bash -c 'refresh_source black-marble "$1"' _ < /tmp/stargazing-sites
          fi
          if [[ "$REFRESH_ERA5" == "true" ]]; then
            xargs -r -n 1 -P 3 bash -c 'refresh_source era5 "$1"' _ < /tmp/stargazing-sites
          fi
          if [[ "$REFRESH_DEM" == "true" ]]; then
            xargs -r -n 1 -P 3 bash -c 'refresh_source dem "$1"' _ < /tmp/stargazing-sites
          fi
      - name: Rebuild image manifest
        if: ${{ inputs.refresh_images }}
        run: pnpm data:images
      - name: Reject unimplemented OSM refreshes
        if: ${{ inputs.refresh_osm }}
        run: |
          echo "OSM refresh was requested, but no reviewed OSM importer is configured." >&2
          exit 1
      - name: Score sites with complete real snapshots
        run: |
          set -euo pipefail
          if jq -e '.status == "calibrated"' data-config/scoring/darkness.json >/dev/null; then
            while IFS= read -r site; do
              if [[ -f "data-snapshots/climate/$site.json" && -f "data-snapshots/black-marble/$site.json" ]]; then
                pnpm data:score:real --site "$site"
              fi
            done < /tmp/stargazing-sites
            pnpm data:score:real:validate
          else
            echo "Skipping real score generation: darkness calibration is not calibrated yet."
          fi
      - name: Rebuild the rolling astronomy calendar for the expanded catalog
        run: |
          set -euo pipefail
          if [[ -s /tmp/stargazing-active-destinations ]]; then
            calendar_start="$(find public/data/stargazing/calendar -mindepth 2 -maxdepth 2 -name '*.json' -print | sed -E 's#^.*/([0-9]{4}-[0-9]{2})\.json$#\1#' | sort | sed -n '1p')"
            [[ "$calendar_start" =~ ^[0-9]{4}-[0-9]{2}$ ]]
            while IFS= read -r destination; do
              pnpm data:calendar:real -- --start "$calendar_start" --months 36 --destination "$destination"
            done < /tmp/stargazing-active-destinations
            pnpm data:calendar:manifest
          else
            echo "Skipping public calendar refresh: the selected cohort contains no active destinations."
          fi
      - run: pnpm data:rebuild
      - run: pnpm data:validate
      - run: pnpm data:p3:images:validate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit derived static data only after all gates pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-snapshots public/data/stargazing public/images
          if git diff --cached --quiet; then
            echo "No derived data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh static snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
